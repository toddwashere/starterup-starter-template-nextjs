description: "Assistant system prompt evals"

# NOTE: prompts/assistant-system.txt must be kept in sync with the
# ASSISTANT_SYSTEM_PROMPT value in packages/ai/src/prompts/assistant-system.ts.
prompts:
  - id: assistant-system
    file: file://prompts/assistant-system.txt
    suffix: "\n\nUser: {{question}}"

# Provider ids use the same `provider:modelId` encoding as the app catalog
# (packages/ai/src/ai-models-available.ts). These mirror the AI_CALL_PRESETS
# models: assistant → openrouter:anthropic/claude-sonnet-4, worker → openai:gpt-4o-mini.
providers:
  - id: openrouter:anthropic/claude-sonnet-4

# Alternative provider (uncomment if OPENROUTER_API_KEY not available):
# providers:
#  - id: openai:gpt-4o-mini

tests: file://tests/golden.yaml
