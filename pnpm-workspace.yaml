packages:
  - "apps/*"
  - "packages/*"
  - "tooling"

# Align Better Auth plugins with the patched 1.6.25 family.
# Also force patched versions for high/critical transitive advisories.
overrides:
  "@better-auth/passkey": "1.6.25"
  better-auth: "1.6.25"
  "@better-auth/stripe": "1.6.25"
  "@better-auth/api-key": "1.6.25"
  "@better-auth/oauth-provider": "1.6.25"
  next: "16.2.12"
  hono: ">=4.12.25"
  axios: ">=1.18.0"
  # @types/request asks for form-data ^2 but resolves a 4.x copy in this tree;
  # pin the patched 4.x release (types-only consumer).
  form-data: "4.0.6"
  postcss: ">=8.5.18"
  "vite@>=7": ">=7.3.5"
  ws: ">=8.21.0"
  brace-expansion: "5.0.8"
  js-yaml: ">=4.3.0"
  fast-uri: ">=3.1.4"
  # Next still peers sharp ^0.34.5; force patched libvips where install allows.
  sharp: ">=0.35.0"

# Supply chain (pnpm 11) — https://pnpm.io/supply-chain-security
minimumReleaseAge: 600 # Wait 10h after a version is published before pnpm may install it (reduces compromised-release window).
blockExoticSubdeps: true # Disallow transitive deps from git/tarball URLs; registry packages only.
# trustPolicy: no-downgrade # Reject installs when a package’s trust level drops vs prior releases (e.g. publisher/provenance change).

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
