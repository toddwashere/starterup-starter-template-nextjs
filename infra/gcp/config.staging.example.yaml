schemaVersion: 1

gcp:
  project: "your-staging-project-id"
  region: "us-central1"

complianceMode: "none"

bootstrap:
  privateNetwork: true
  vpcCidr: "10.10.0.0/24"
  budgetAmount: 100
  billingAccountId: ""
  githubRepo: ""
  securityContactEmail: ""

database:
  tier: "db-custom-2-7680"
  version: "POSTGRES_16"
  availability: "REGIONAL"
  pointInTimeRecovery: false

storage:
  forceDestroy: false

messaging:
  enableRedis: false
  redisTier: "BASIC"
  redisMemorySizeGb: 1

apps:
  imageTag: "latest"
  enableHttpsLb: false
  enableMonitoring: true
  lbDomain: ""
  alertEmail: "alerts@example.com"
  vpcServiceControls: false
  accessPolicyId: ""
