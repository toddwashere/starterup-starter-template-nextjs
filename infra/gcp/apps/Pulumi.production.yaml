  starter-gcp-apps:coreStackRef: "<org>/starter-gcp-core/production"
  starter-gcp-apps:imageRegistry: "us-central1-docker.pkg.dev/<prod-project>/starter"
  starter-gcp-apps:imageTag: "v0.1.0"
