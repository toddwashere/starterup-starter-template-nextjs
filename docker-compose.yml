services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Long-lived worker that consumes jobs from a BullMQ Redis queue and runs
  # registered handlers. Connects to Postgres for DB work and Redis for queue I/O.
  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Inside the compose network postgres is reachable by service name.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      WORKER_QUEUE_ADAPTER: bullmq
      BULLMQ_QUEUE_NAME: jobs
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: 4300
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_MAX_ATTEMPTS: 5
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:4000
      # Email is optional locally; without RESEND_API_KEY the welcome-email
      # handler just logs. Uncomment to send real email:
      # RESEND_API_KEY: ${RESEND_API_KEY}
      # EMAIL_FROM: ${EMAIL_FROM}
    ports:
      - "4300:4300"

volumes:
  postgres_data:
