name: Deploy GCP

on:
  pull_request:
    paths:
      - "infra/gcp/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-gcp.yml"

permissions:
  contents: read
  id-token: write   # required for WIF/OIDC
  pull-requests: write  # for posting preview comments

env:
  PULUMI_SKIP_UPDATE_CHECK: "true"

# ---------------------------------------------------------------------------
# preview — runs on pull_request; posts pulumi preview as PR comment
# ---------------------------------------------------------------------------
jobs:
  preview:
    if: github.event_name == 'pull_request'
    name: Pulumi preview (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install root deps (tsx)
        run: pnpm install --frozen-lockfile

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install Pulumi layer deps
        run: |
          for d in bootstrap database storage messaging secrets apps; do
            (cd "infra/gcp/$d" && pnpm install)
          done

      - name: Run infra:preview
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: pnpm infra:preview --env sandbox
