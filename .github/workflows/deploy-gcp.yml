name: Deploy GCP

on:
  pull_request:
    paths:
      - "infra/gcp/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-gcp.yml"

permissions:
  contents: read
  id-token: write   # required for OIDC
  pull-requests: write  # for posting preview comments

env:
  PULUMI_SKIP_UPDATE_CHECK: "true"

# ---------------------------------------------------------------------------
# preview — runs on pull_request; posts pulumi preview as PR comment
# ---------------------------------------------------------------------------
jobs:
  preview:
    if: github.event_name == 'pull_request'
    name: Pulumi preview (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install deps (core stack)
        working-directory: infra/gcp/core
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps stack)
        working-directory: infra/gcp/apps
        run: pnpm install --frozen-lockfile

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Pulumi preview (core)
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/gcp/core
          comment-on-pr: true
          policy-pack: ../../shared/policies
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi preview (apps)
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/gcp/apps
          comment-on-pr: true
          policy-pack: ../../shared/policies
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
