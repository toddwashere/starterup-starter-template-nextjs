name: Deploy GCP

on:
  push:
    branches: [main]
    paths:
      - "infra/gcp/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-gcp.yml"
  pull_request:
    paths:
      - "infra/gcp/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Pulumi stack (sandbox or production)"
        required: true
        default: sandbox

permissions:
  contents: read
  id-token: write   # required for OIDC
  pull-requests: write  # for posting preview comments

env:
  PULUMI_SKIP_UPDATE_CHECK: "true"

# ---------------------------------------------------------------------------
# preview — runs on pull_request; posts pulumi preview as PR comment
# ---------------------------------------------------------------------------
jobs:
  preview:
    if: github.event_name == 'pull_request'
    name: Pulumi preview (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install deps (core stack)
        working-directory: infra/gcp/core
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps stack)
        working-directory: infra/gcp/apps
        run: pnpm install --frozen-lockfile

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Pulumi preview (core)
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/gcp/core
          comment-on-pr: true
          policy-pack: ../../shared/policies
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi preview (apps)
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/gcp/apps
          comment-on-pr: true
          policy-pack: ../../shared/policies
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

# ---------------------------------------------------------------------------
# build-images — builds and pushes all app containers to Artifact Registry
# runs on push to main or workflow_dispatch
# ---------------------------------------------------------------------------
  build-images:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Build and push container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        app:
          - { name: dashboard,   dockerfile: infra/shared/docker/Dockerfile.dashboard }
          - { name: www,         dockerfile: infra/shared/docker/Dockerfile.www }
          - { name: public-api,  dockerfile: infra/shared/docker/Dockerfile.public-api }
          - { name: public-mcp,  dockerfile: infra/shared/docker/Dockerfile.public-mcp }
          - { name: workers,     dockerfile: apps/workers/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ vars.GCP_ARTIFACT_REGISTRY }}/${{ matrix.app.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,scope=${{ matrix.app.name }},mode=max

# ---------------------------------------------------------------------------
# deploy — migrate → pulumi up (core) → pulumi up (apps) → smoke test
# gated by GitHub Environment "production-gcp" (manual approval required)
# ---------------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Deploy (Pulumi up)
    needs: [build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-gcp   # GitHub Environment — add required reviewers to gate this
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # production for push to main; let workflow_dispatch choose sandbox or production
      - name: Resolve stack name
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.stack }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
          fi

      # Run migrations BEFORE rolling new images so existing code keeps running.
      # DATABASE_URL_DEPLOY should point at Cloud SQL via the Cloud SQL Auth Proxy
      # or a direct connection string secured via Secret Manager / IAM.
      - name: Install deps (database)
        working-directory: packages/database
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEPLOY }}
        run: pnpm exec prisma migrate deploy

      # Deploy core infrastructure (Cloud SQL, Pub/Sub, Secret Manager)
      - name: Install deps (core stack)
        working-directory: infra/gcp/core
        run: pnpm install --frozen-lockfile

      - name: Pulumi up (core)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ steps.stack.outputs.name }}
          work-dir: infra/gcp/core
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Deploy app services (Cloud Run) — imageTag pins every service to this SHA
      - name: Install deps (apps stack)
        working-directory: infra/gcp/apps
        run: pnpm install --frozen-lockfile

      - name: Pulumi up (apps)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ steps.stack.outputs.name }}
          work-dir: infra/gcp/apps
          config-map: |
            imageTag: { value: "${{ github.sha }}" }
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Smoke-test /health on dashboard and public-api (5 attempts, 5 s apart)
      - name: Smoke health endpoints
        run: |
          DASH=$(cd infra/gcp/apps && pulumi stack output dashboardUrl --stack "${{ steps.stack.outputs.name }}")
          API=$(cd infra/gcp/apps && pulumi stack output publicApiUrl --stack "${{ steps.stack.outputs.name }}")
          for svc in "$DASH" "$API"; do
            echo "Checking $svc/health"
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS "$svc/health" >/dev/null 2>&1; then
                echo "  $svc OK"
                ok=1
                break
              fi
              echo "  attempt $i failed, sleeping 5s"
              sleep 5
            done
            if [[ $ok -eq 0 ]]; then
              echo "ERROR: $svc/health did not respond after 5 attempts" >&2
              exit 1
            fi
          done
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
