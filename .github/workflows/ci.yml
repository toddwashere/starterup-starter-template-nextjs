name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/starter_dev
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate .env.example
        run: pnpm validate:env

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Start Postgres (pgmq + pg_cron)
        run: |
          docker build -t starter-postgres:16 docker/postgres
          docker run -d --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=starter_dev \
            -p 5432:5432 \
            starter-postgres:16
          for i in $(seq 1 60); do
            if pg_isready -h localhost -U postgres; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres failed to start"
          docker logs postgres
          exit 1

      - name: Run database migrations
        run: pnpm --filter @workspace/database exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Stop Postgres
        if: always()
        run: docker rm -f postgres || true
