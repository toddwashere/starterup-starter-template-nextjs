name: Deploy AWS

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-aws.yml"
  pull_request:
    paths:
      - "infra/aws/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Pulumi stack (sandbox, staging, or production)"
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - staging
          - production

permissions:
  contents: read
  id-token: write # required for OIDC
  pull-requests: write # for posting preview comments

env:
  PULUMI_SKIP_UPDATE_CHECK: "true"
  PULUMI_ORG: organization

# ---------------------------------------------------------------------------
# preview — runs on pull_request; posts pulumi preview as PR comment
# ---------------------------------------------------------------------------
jobs:
  preview:
    if: github.event_name == 'pull_request'
    name: Pulumi preview (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sandbox-aws
    env:
      # Prefer canonical identity; keep legacy alias for migrating environments.
      AWS_RESOURCE_PREFIX: ${{ vars.AWS_RESOURCE_PREFIX || vars.AWS_STATE_RESOURCE_PREFIX || 'starter' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install AWS infrastructure dependencies
        working-directory: infra/aws
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          test "$actual" = "${{ vars.AWS_ACCOUNT_ID }}" || {
            echo "Expected AWS account ${{ vars.AWS_ACCOUNT_ID }}, got $actual" >&2
            exit 1
          }

      - name: Pulumi preview (core)
        uses: pulumi/actions@v6
        env:
          AWS_RESOURCE_PREFIX: ${{ env.AWS_RESOURCE_PREFIX }}
          AWS_DNS_ROOT_DOMAIN: ${{ vars.AWS_DNS_ROOT_DOMAIN }}
          AWS_POOLER_APP_EGRESS_CIDRS: ${{ vars.AWS_POOLER_APP_EGRESS_CIDRS }}
          AWS_POOLER_DEVELOPER_CIDRS: ${{ vars.AWS_POOLER_DEVELOPER_CIDRS }}
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/aws/core
          cloud-url: "s3://${{ env.AWS_RESOURCE_PREFIX }}-sandbox-${{ vars.AWS_STATE_ACCOUNT_ID }}-${{ vars.AWS_STATE_REGION }}?region=${{ vars.AWS_STATE_REGION }}&awssdk=v2"
          comment-on-pr: true
          policy-pack: ../../shared/policies

      - name: Pulumi preview (apps)
        uses: pulumi/actions@v6
        env:
          AWS_RESOURCE_PREFIX: ${{ env.AWS_RESOURCE_PREFIX }}
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/aws/apps
          cloud-url: "s3://${{ env.AWS_RESOURCE_PREFIX }}-sandbox-${{ vars.AWS_STATE_ACCOUNT_ID }}-${{ vars.AWS_STATE_REGION }}?region=${{ vars.AWS_STATE_REGION }}&awssdk=v2"
          comment-on-pr: true
          policy-pack: ../../shared/policies

  # ---------------------------------------------------------------------------
  # build-images — builds and pushes all app containers to ECR
  # runs on push to main or workflow_dispatch
  # ---------------------------------------------------------------------------
  build-images:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Build and push container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && format('{0}-aws', inputs.stack) || 'production-aws' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        app:
          - { name: dashboard, dockerfile: infra/shared/docker/Dockerfile.dashboard }
          - { name: www, dockerfile: infra/shared/docker/Dockerfile.www }
          - { name: public-api, dockerfile: infra/shared/docker/Dockerfile.public-api }
          - { name: public-mcp, dockerfile: infra/shared/docker/Dockerfile.public-mcp }
          - { name: workers, dockerfile: apps/workers/Dockerfile }
          - { name: workers-lambda, dockerfile: apps/workers/Dockerfile.lambda }
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          test "$actual" = "${{ vars.AWS_ACCOUNT_ID }}" || {
            echo "Expected AWS account ${{ vars.AWS_ACCOUNT_ID }}, got $actual" >&2
            exit 1
          }

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Public URL build-args for Next.js apps. Staging/sandbox use env apex
      # (`app.staging.<root>`); production uses bare labels on the root.
      - name: Resolve NEXT_PUBLIC build-args
        id: public_urls
        env:
          STACK: ${{ github.event_name == 'workflow_dispatch' && inputs.stack || 'production' }}
          ROOT: ${{ vars.AWS_DNS_ROOT_DOMAIN }}
        run: |
          set -euo pipefail
          root="${ROOT:?AWS_DNS_ROOT_DOMAIN var required}"
          if [[ "$STACK" == "production" ]]; then
            apex="$root"
          else
            apex="${STACK}.${root}"
          fi
          {
            echo "dashboard=https://app.${apex}"
            echo "www=https://${apex}"
            echo "api=https://api.${apex}"
            echo "mcp=https://mcp.${apex}"
            echo "auth=https://app.${apex}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ vars.AWS_ECR_REGISTRY }}/${{ matrix.app.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,scope=${{ matrix.app.name }},mode=max
          build-args: |
            NEXT_PUBLIC_DASHBOARD_URL=${{ steps.public_urls.outputs.dashboard }}
            NEXT_PUBLIC_WWW_URL=${{ steps.public_urls.outputs.www }}
            NEXT_PUBLIC_API_URL=${{ steps.public_urls.outputs.api }}
            NEXT_PUBLIC_MCP_URL=${{ steps.public_urls.outputs.mcp }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ steps.public_urls.outputs.auth }}

  # ---------------------------------------------------------------------------
  # deploy — migrate → pulumi up (core) → pulumi up (apps) → smoke test
  # gated by GitHub Environment "production-aws" (manual approval required)
  # ---------------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Deploy (Pulumi up)
    needs: [build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && format('{0}-aws', inputs.stack) || 'production-aws' }}
    env:
      AWS_RESOURCE_PREFIX: ${{ vars.AWS_RESOURCE_PREFIX || vars.AWS_STATE_RESOURCE_PREFIX || 'starter' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          test "$actual" = "${{ vars.AWS_ACCOUNT_ID }}" || {
            echo "Expected AWS account ${{ vars.AWS_ACCOUNT_ID }}, got $actual" >&2
            exit 1
          }

      # production for push to main; workflow_dispatch uses its constrained choice.
      - name: Resolve stack name
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.stack }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
          fi

      # Run migrations BEFORE rolling new images so existing code keeps running.
      # Requires secret: DIRECT_URL_DEPLOY — the direct (non-pooled) RDS connection string.
      # Prisma resolves DIRECT_URL ?? DATABASE_URL for migrations (Task 1 convention).
      - name: Install deps (database)
        working-directory: packages/database
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: packages/database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL_DEPLOY }}
        run: pnpm exec prisma migrate deploy

      # Deploy core infrastructure (RDS, SQS, Secrets Manager)
      - name: Install AWS infrastructure dependencies
        working-directory: infra/aws
        run: pnpm install --frozen-lockfile

      - name: Pulumi up (core)
        uses: pulumi/actions@v6
        env:
          AWS_RESOURCE_PREFIX: ${{ env.AWS_RESOURCE_PREFIX }}
          AWS_DNS_ROOT_DOMAIN: ${{ vars.AWS_DNS_ROOT_DOMAIN }}
          AWS_POOLER_APP_EGRESS_CIDRS: ${{ vars.AWS_POOLER_APP_EGRESS_CIDRS }}
          AWS_POOLER_DEVELOPER_CIDRS: ${{ vars.AWS_POOLER_DEVELOPER_CIDRS }}
        with:
          command: up
          stack-name: ${{ steps.stack.outputs.name }}
          work-dir: infra/aws/core
          cloud-url: "s3://${{ env.AWS_RESOURCE_PREFIX }}-${{ steps.stack.outputs.name }}-${{ vars.AWS_STATE_ACCOUNT_ID }}-${{ vars.AWS_STATE_REGION }}?region=${{ vars.AWS_STATE_REGION }}&awssdk=v2"

      # Deploy app services: App Runner rolling update (dashboard, www, public-api, public-mcp)
      # + workers Lambda (Function + EventSourceMapping) — all managed by the apps stack.
      # imageTag pins every service to this SHA; no separate Lambda publish step needed.
      - name: Pulumi up (apps)
        uses: pulumi/actions@v6
        env:
          AWS_RESOURCE_PREFIX: ${{ env.AWS_RESOURCE_PREFIX }}
          AWS_DNS_ROOT_DOMAIN: ${{ vars.AWS_DNS_ROOT_DOMAIN }}
        with:
          command: up
          stack-name: ${{ steps.stack.outputs.name }}
          work-dir: infra/aws/apps
          cloud-url: "s3://${{ env.AWS_RESOURCE_PREFIX }}-${{ steps.stack.outputs.name }}-${{ vars.AWS_STATE_ACCOUNT_ID }}-${{ vars.AWS_STATE_REGION }}?region=${{ vars.AWS_STATE_REGION }}&awssdk=v2"
          config-map: |
            imageTag: { value: "${{ github.sha }}" }

      - name: Smoke test dashboard health
        working-directory: infra/aws/apps
        env:
          PULUMI_BACKEND_URL: "s3://${{ env.AWS_RESOURCE_PREFIX }}-${{ steps.stack.outputs.name }}-${{ vars.AWS_STATE_ACCOUNT_ID }}-${{ vars.AWS_STATE_REGION }}?region=${{ vars.AWS_STATE_REGION }}&awssdk=v2"
          STACK: ${{ steps.stack.outputs.name }}
          ROOT: ${{ vars.AWS_DNS_ROOT_DOMAIN }}
        run: |
          set -euo pipefail
          # Prefer custom domain when DNS root is configured; fall back to App Runner URL.
          if [[ -n "${ROOT:-}" ]]; then
            if [[ "$STACK" == "production" ]]; then
              SMOKE_URL="https://app.${ROOT}/api/health"
            else
              SMOKE_URL="https://app.${STACK}.${ROOT}/api/health"
            fi
          else
            pulumi login "$PULUMI_BACKEND_URL"
            HOST=$(pulumi stack output dashboardUrl --stack "$STACK")
            SMOKE_URL="https://${HOST}/api/health"
          fi
          echo "Smoke: $SMOKE_URL"
          curl --fail --retry 5 --retry-all-errors --retry-delay 15 "$SMOKE_URL"
