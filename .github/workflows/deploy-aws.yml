name: Deploy AWS

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-aws.yml"
  pull_request:
    paths:
      - "infra/aws/**"
      - "infra/shared/docker/**"
      - "infra/shared/policies/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      stack:
        description: "Pulumi stack (sandbox or production)"
        required: true
        default: sandbox

permissions:
  contents: read
  id-token: write   # required for OIDC
  pull-requests: write  # for posting preview comments

env:
  PULUMI_SKIP_UPDATE_CHECK: "true"

# ---------------------------------------------------------------------------
# preview — runs on pull_request; posts pulumi preview as PR comment
# ---------------------------------------------------------------------------
jobs:
  preview:
    if: github.event_name == 'pull_request'
    name: Pulumi preview (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install deps (core stack)
        working-directory: infra/aws/core
        run: pnpm install --frozen-lockfile

      - name: Install deps (apps stack)
        working-directory: infra/aws/apps
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pulumi preview (core)
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/aws/core
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi preview (apps)
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: sandbox
          work-dir: infra/aws/apps
          comment-on-pr: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

# ---------------------------------------------------------------------------
# build-images — builds and pushes all app containers to ECR
# runs on push to main or workflow_dispatch
# ---------------------------------------------------------------------------
  build-images:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Build and push container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        app:
          - { name: dashboard,   dockerfile: infra/shared/docker/Dockerfile.dashboard }
          - { name: www,         dockerfile: infra/shared/docker/Dockerfile.www }
          - { name: public-api,  dockerfile: infra/shared/docker/Dockerfile.public-api }
          - { name: public-mcp,  dockerfile: infra/shared/docker/Dockerfile.public-mcp }
          - { name: workers,     dockerfile: apps/workers/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ vars.AWS_ECR_REGISTRY }}/${{ matrix.app.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,scope=${{ matrix.app.name }},mode=max

# ---------------------------------------------------------------------------
# deploy — migrate → pulumi up (core) → pulumi up (apps) → smoke test
# gated by GitHub Environment "production-aws" (manual approval required)
# ---------------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Deploy (Pulumi up)
    needs: [build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-aws   # GitHub Environment — add required reviewers to gate this
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # production for push to main; let workflow_dispatch choose sandbox or production
      - name: Resolve stack name
        id: stack
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.stack }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
          fi

      # Run migrations BEFORE rolling new images so existing code keeps running.
      # DATABASE_URL_DEPLOY should point at RDS via a secure connection string.
      - name: Install deps (database)
        working-directory: packages/database
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEPLOY }}
        run: pnpm exec prisma migrate deploy

      # Deploy core infrastructure (RDS, SQS, Secrets Manager)
      - name: Install deps (core stack)
        working-directory: infra/aws/core
        run: pnpm install --frozen-lockfile

      - name: Pulumi up (core)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ steps.stack.outputs.name }}
          work-dir: infra/aws/core
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Deploy app services (ECS Fargate) — imageTag pins every service to this SHA
      - name: Install deps (apps stack)
        working-directory: infra/aws/apps
        run: pnpm install --frozen-lockfile

      - name: Pulumi up (apps)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ steps.stack.outputs.name }}
          work-dir: infra/aws/apps
          config-map: |
            imageTag: { value: "${{ github.sha }}" }
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
